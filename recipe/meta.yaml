{% set name = "fastapi-oidc" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: cac0682715ce9bd94af06d23627e8e0788d52d330b71f9be0bdd42fcc77fc4ff

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.10,<4.0
    - pip
    - poetry
  run:
    - python >=3.10,<4.0
    - cachetools >=4.1.1
    - fastapi >=0.61.0
    - pydantic >=2.0.0
    - python-jose >=3.2.0
    - requests >=2.24.0

test:
  imports:
    - fastapi_oidc
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/HarryMWinters/fastapi-oidc
  summary: A simple library for parsing and verifying externally issued OIDC ID tokens in fastapi.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dangercrow
